# Verified 2026-11-08 against the live API: one series per geo with these filters.
#   coverage: EU27_2020 2005..2025, DE 2005..2025, FR 2005..2025, IT 2010..2025 (28 of 31 EU/EFTA countries have data)
# Note: Eurostat only: the World Bank has no house price series.
id: house_price_index
source: eurostat
source_code: "prc_hpi_a"
name: "House price index (2015=100)"
theme: prices
aliases:
