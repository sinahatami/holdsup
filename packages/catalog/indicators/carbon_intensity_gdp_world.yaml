definition: "Annual emissions of carbon dioxide from the agriculture, energy, waste and industrial sectors, excluding land use, land-use change and forestry (LULUCF), divided by GDP in 2021 PPP dollars."
unit: "kg CO2e per 2021 PPP $ of GDP"
frequency: annual
geo_coverage: ["All countries", "WLD"]
