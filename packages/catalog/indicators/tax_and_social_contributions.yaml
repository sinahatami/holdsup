  - "taxes plus social security contributions as a share of GDP"
  - "overall tax and contribution receipts relative to GDP"
definition: "Total receipts from taxes and social contributions, including imputed social contributions, after deduction of amounts assessed but unlikely to be collected, as a percentage of GDP."
