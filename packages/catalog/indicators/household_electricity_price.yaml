# Note: Published twice a year (periods 2024-S1, 2024-S2). A claim about a whole year is read as the average of the year's two half-yearly prices (annual_value: mean); the receipt says so. Only the middle consumption band (DC) with all taxes and levies is catalogued, so a claim about another band or about the price before taxes does not match.
