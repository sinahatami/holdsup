# Verified 2026-11-08 against the live API: one series per geo with these filters.
#   coverage: EU27_2020 2002..2025, DE 1996..2025, FR 1993..2025, IT 1992..2025 (30 of 31 EU/EFTA countries have data)
# Note: Eurostat only: the World Bank has no early-leaver series.
id: early_school_leavers
source: eurostat
source_code: "edat_lfse_14"
name: "Early leavers from education and training (Eurostat)"
theme: education
aliases:
  - "share of 18-24 year olds who left education early"
  - "young people with no more than lower secondary education and no further training"
  - "young adults who stopped their education early"
definition: "Share of people aged 18 to 24 who have at most lower secondary education and are not in further education or training, as a percentage of the population of that age."
unit: "% of population aged 18-24"
frequency: annual
geo_coverage: ["EU27_2020", "EU member states", "CH", "IS", "NO"]
first_year: 1992
last_year: null # still updated (latest period seen: 2025)
related: [tertiary_attainment, neet_rate]
filters: { sex: "T", wstatus: "POP", age: "Y18-24", unit: "PC" }
