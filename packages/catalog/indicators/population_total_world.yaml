# Verified 2026-11-08 against the live API: one series per geo with these filters.
#   coverage: IN 1960..2025, IT 1960..2025, US 1960..2025
# Note: Mid-year estimate, a little different from Eurostat's 1 January count. The denominator for per-capita checks outside Europe.
id: population_total_world
source: worldbank
source_code: "SP.POP.TOTL"
name: "Total population (World Bank)"
aliases:
  - "population of the country"
  - "number of inhabitants worldwide"
  - "how many people live in the country (World Bank)"
  - "total number of residents (mid-year estimate)"
  - "population size by country"
definition: "Mid-year estimate of all residents of a country regardless of legal status or citizenship, from national and UN sources."
unit: "persons"
frequency: annual
geo_coverage: ["All countries", "WLD"]
first_year: 1960
last_year: null # still updated
related: [population_total]
filters: {}
