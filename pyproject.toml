[project]
name = "holdsup-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]
# ml/ is its own project with its own lockfile: training libraries never enter this one.
exclude = ["ml"]

[dependency-groups]
dev = [
    "httpx",
    "hypothesis>=6.170.15",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["apps/web", "node_modules"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["holdsup", "reranker"]
