# Terms of office, for resolving "since I took office" / "under the last Labour government"
# in code instead of from the model's memory (docs/notes.md "P1.12 Pivot test review", item 3).
# Heads of government for the countries in the seed claims, plus governing parties where
# claims name a party. Dates are the day the term started and ended; end: null = in office.
# Last checked: 2026-11-07 against the agent's knowledge (to mid-2026). Verify before relying
# on a recent change of government, and add countries as the catalog grows.
#
# aliases: other ways a claim names the holder. Matched as whole words, case-insensitive.
# Avoid aliases that are common words ("May", "Brown", "Bush" alone).

holders:
