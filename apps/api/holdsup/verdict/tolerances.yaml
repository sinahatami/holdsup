# Verdict tolerances (docs/spec.md "Tolerances"). Shown on every receipt.
# Tune on the dev split only (P4.7); bump `version` whenever a value changes.
version: 1

# "Supported" also needs the claim to hold in at least this share of reasonable time windows
# (the cherry-pick sweep, P3.1); below it the label is "supported, but framing matters".
framing_threshold: 0.7

# A stated value holds when |computed - asserted| <= the largest of:
#   relative × |asserted|, absolute, and (if rounding) half a unit of the asserted number's
#   last written digit (23 → 0.5, 2.3 → 0.05).
values:
  level: { relative: 0.05, rounding: true } # "debt of 2.9 trillion euros"
  level_rate: { absolute: 0.5, rounding: true } # levels of series in % ("youth unemployment is 20%")
  absolute: { relative: 0.05, rounding: true } # "grew by 116 billion euros"
  percent: { relative: 0.05, rounding: true } # "down 23%", also a growth rate or CAGR
  percentage_points: { absolute: 0.5, rounding: true } # "fallen 12 points"
  ratio: { relative: 0.05, rounding: false } # "halved", "doubled": words, not rounded numbers
  rank: { absolute: 0, rounding: false } # positions are exact

# "Flat", "stable": the change from start to end is within this share of the start value.
flat_relative: 0.02

# A trend claim ("is falling") also needs the straight line to explain this share of variance.
trend_min_r2: 0.5

# How far (in periods) a requested start or end may be from the nearest available value.
# Farther → can't check. Nearer but not exact → the substitution is flagged on the receipt.
max_period_gap: { annual: 1, quarterly: 2, monthly: 3 }
