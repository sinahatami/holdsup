name: API image

# Builds the API bundle (make api-bundle) the way a deploy builds it (DEPLOY.md) and
# checks the image starts: production with incomplete settings refuses to start, and
# production with complete (dummy) settings serves health and the catalog.
# On a push to main, a pass then deploys that commit to Cloud Run (cd.yml).
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/catalog/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "Makefile"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/catalog/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "Makefile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. On main the newer run waits, so a
# deploy is never cut off halfway.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: API bundle builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write the API bundle
        run: |
          make api-bundle
          echo "BUNDLE=.cache/api-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build the image from the bundle (as a deploy does)
        run: docker build -t holdsup-api:ci "$BUNDLE"

      - name: Incomplete production settings refuse to start
        run: |
          set +e
          out=$(timeout 120 docker run --rm holdsup-api:ci 2>&1)
          code=$?
          set -e
          echo "$out" | tail -n 20
          test "$code" -ne 0
          for name in "Refusing to start in production" DATABASE_URL TRUSTED_PROXIES WEB_ORIGIN; do
            echo "$out" | grep -q "$name"
          done

      - name: Complete production settings serve health and catalog
        run: |
          # Dummy values: nothing here reaches a database or a model provider.
          docker run -d --name api -p 127.0.0.1:7860:7860 \
            -e DATABASE_URL=postgresql+asyncpg://127.0.0.1:9/none \
            -e TRUSTED_PROXIES=1 -e WEB_ORIGIN=https://holdsup.example \
            holdsup-api:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7860/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/v1/catalog > catalog.json
          python3 - <<'EOF'
          import json
          catalog = json.load(open("catalog.json"))
          assert catalog["version"] and len(catalog["indicators"]) > 0, catalog
          print(len(catalog["indicators"]), "indicators")
          EOF
          docker inspect api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^APP_COMMIT=[0-9a-f]'

      - name: API logs
        if: always()
        run: docker logs api 2>&1 | tail -n 50 || true

  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
