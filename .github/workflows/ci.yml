name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (ruff, mypy, eslint, tsc, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile
      - name: Lint and type-check
        run: make lint

  unit-tests:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Download embedding model (setup step; tests themselves stay offline)
        run: make embed-model
      - name: Run tests
        run: make test
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/api/coverage.xml
            apps/web/coverage/
          if-no-files-found: warn

  e2e:
    name: Playwright (mocked API) and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build (catches prerender errors that next dev only warns about)
        run: pnpm --filter @holdsup/web build
        env:
          # Nothing listens here: the gallery read fails fast and the page prerenders empty.
          HOLDSUP_API_URL: http://127.0.0.1:9
      - run: pnpm --filter @holdsup/web exec playwright install --with-deps chromium
      - run: make e2e
