name: Keep-alive

# Hugging Face Spaces sleeps after about 48 hours idle; ping /v1/health twice a day.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-latest
    steps:
      - name: GET /v1/health
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::notice::API_BASE_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 60 "$API_BASE_URL/v1/health"
